<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeerMometr 🍺</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding:24px;
}

.container{
max-width:900px;
margin:auto;
}

.hero{
text-align:center;
margin-bottom:32px;
}

.hero h1{
font-size:42px;
margin:10px 0;
}

.hero p{
color:#94a3b8;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#1e293b;
border-radius:22px;
padding:24px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
margin-top:0;
}

select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#334155;
color:white;
margin-top:8px;
margin-bottom:16px;
font-size:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#f59e0b;
color:#111827;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-1px);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.leader-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.feed{
margin-top:28px;
}

.cheer{
background:#1e293b;
padding:16px;
border-radius:16px;
margin-bottom:12px;
}

.confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
}

.beer{
position:absolute;
font-size:26px;
animation:fall 2s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-40px) rotate(0deg);
opacity:1;
}

to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

.status{
text-align:center;
color:#94a3b8;
font-size:13px;
margin-top:12px;
}

@media(max-width:720px){

.grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="container">

<div class="hero">

<div style="font-size:54px;">
🍺
</div>

<h1>
BeerMeter
</h1>

<p>
Celebrate wins • One beer at a time
</p>

</div>


<div class="grid">


<!-- GIVE A BEER -->

<div class="card">

<h2>
Give a Beer
</h2>

<label>
Who deserves one?
</label>

<select id="person">

<option>JD</option>
<option>Arjan</option>
<option>Ana</option>
<option>Iryna</option>

</select>


<label>
Why?
</label>

<textarea
id="reason"
rows="3"
placeholder="Saved a renewal, jumped into an escalation, helped with onboarding..."
></textarea>


<button
id="cheersButton"
onclick="giveBeer()"
>
🍻 Cheers!
</button>


<div
id="status"
class="status"
></div>

</div>


<!-- LEADERBOARD -->

<div class="card">

<h2>
Leaderboard
</h2>

<div id="leaderboard">
Loading...
</div>

</div>

</div>


<!-- WALL -->

<div class="feed">

<h2>
Wall of Cheers
</h2>

<div id="feed">
Loading...
</div>

</div>

</div>


<div
id="confetti"
class="confetti"
></div>


<script>


/* =====================================
   GOOGLE APPS SCRIPT URL
===================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzfgEop2-VA0B2tISzdAgItSprZPZoFO4Zy6U86aS22VhXlIRWe_RJFhAPUmFMAeCiKag/exec";


/* =====================================
   PEOPLE
===================================== */

const PEOPLE = [
"JD",
"Arjan",
"Ana",
"Iryna"
];


let cheers = [];


/* =====================================
   LOAD VOTES
===================================== */

function loadVotes(){

return new Promise((resolve, reject) => {


const callbackName =
"beerMeterCallback_" + Date.now();


const script =
document.createElement("script");


window[callbackName] = function(data){

try{


if(
!Array.isArray(data) ||
data.length < 2
){

cheers = [];

}else{


cheers = data
.slice(1)
.map(row => ({

timestamp: row[0],

name: row[1],

reason: row[2]

}))
.filter(item => item.name);

}


/* update UI */

renderLeaderboard();

renderFeed();


resolve();


}catch(error){


console.error(
"Error processing votes:",
error
);


reject(error);


}finally{


delete window[callbackName];

script.remove();


}

};


/* JSONP URL */

script.src =
API_URL +
"?callback=" +
encodeURIComponent(callbackName);


/* loading error */

script.onerror = function(){


delete window[callbackName];

script.remove();


console.error(
"Could not load votes."
);


document.getElementById(
"leaderboard"
).innerHTML =
"<p>Could not load results.</p>";


document.getElementById(
"feed"
).innerHTML =
"<p>Could not load cheers.</p>";


reject(
new Error(
"Could not load votes"
)
);


};


/* add script to page */

document.body.appendChild(script);


});

}


/* =====================================
   LEADERBOARD
===================================== */

function renderLeaderboard(){


const scores = {};


PEOPLE.forEach(person => {

scores[person] = 0;

});


/* count beers */

cheers.forEach(item => {


if(
scores[item.name] !== undefined
){

scores[item.name]++;

}

});


const board =
document.getElementById(
"leaderboard"
);


board.innerHTML = "";


/* sort */

Object.entries(scores)

.sort(
(a,b) =>
b[1] - a[1]
)

.forEach(
([name,count],i) => {


const medal =

i === 0
? "🥇"

: i === 1
? "🥈"

: i === 2
? "🥉"

: "🍺";


board.innerHTML += `

<div class="leader-row">

<div>
${medal}
${escapeHtml(name)}
</div>

<div>
${count} 🍺
</div>

</div>

`;


});


}


/* =====================================
   WALL OF CHEERS
===================================== */

function renderFeed(){


const feed =
document.getElementById(
"feed"
);


feed.innerHTML = "";


if(
cheers.length === 0
){

feed.innerHTML =
"<p>No beers yet. Be the first! 🍺</p>";

return;

}


/* newest first */

cheers
.slice()
.reverse()
.forEach(item => {


feed.innerHTML += `

<div class="cheer">

<strong>
🍺 ${escapeHtml(item.name)}
</strong>

<br>

${escapeHtml(
item.reason ||
"For being awesome."
)}

</div>

`;


});


}


/* =====================================
   GIVE BEER
===================================== */

async function giveBeer(){


const button =
document.getElementById(
"cheersButton"
);


const status =
document.getElementById(
"status"
);


const name =
document.getElementById(
"person"
).value;


const reason =

document
.getElementById("reason")
.value
.trim()

|| "For being awesome.";


button.disabled = true;


status.textContent =
"Sending your beer... 🍺";


try{


await fetch(
API_URL,
{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

name:name,

reason:reason

})

});


/*
Google Apps Script accepts
the POST request.

Because no-cors is used,
the browser cannot read
the response.

But the vote is sent.
*/


document.getElementById(
"reason"
).value = "";


launchConfetti();


status.textContent =
"Beer delivered! 🍻";


/*
Wait a little bit for
Google Sheet to update,
then reload results.
*/

setTimeout(
async () => {


await loadVotes();


button.disabled = false;


},
1000
);


}catch(error){


console.error(
"Could not send vote:",
error
);


status.textContent =
"Something went wrong. Please try again.";


button.disabled = false;


}

}


/* =====================================
   CONFETTI
===================================== */

function launchConfetti(){


const c =
document.getElementById(
"confetti"
);


for(
let i = 0;
i < 18;
i++
){


const e =
document.createElement(
"div"
);


e.className =
"beer";


e.textContent =

Math.random() > .5
? "🍺"
: "✨";


e.style.left =
Math.random() * 100 +
"vw";


e.style.animationDelay =
Math.random() * .4 +
"s";


c.appendChild(e);


setTimeout(
() => e.remove(),
2200
);


}

}


/* =====================================
   HTML ESCAPE
===================================== */

function escapeHtml(value){


return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================
   START APP
===================================== */

loadVotes();


</script>

</body>
</html>
